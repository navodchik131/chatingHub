  $$('[data-st]').forEach(b=>b.onclick=()=>{S.setTab=b.dataset.st;$$('[data-st]').forEach(x=>x.classList.toggle('on',x===b));$('#st-'+b.dataset.st).scrollIntoView({behavior:'smooth',block:'start'})});
  $('#testConn').onclick=async ev=>{const b=ev.currentTarget;b.disabled=true;b.innerHTML='<span class="spin"></span> Проверяю';const t0=performance.now();
    try{await callGrok('ping',[{role:'user',content:[T('Скажи: работает')]}]);S.conn=((performance.now()-t0)/1000).toFixed(1)+' с';toast('Grok отвечает')}catch(e){S.conn=null;toast(e.message,true)}
    render()};
  $('#rulesIn').oninput=e=>{$('#rulesCount').textContent=e.target.value.length+' / 4000';$('#rulesSaved').textContent=''};
  $('#saveRules').onclick=()=>{LS.s('limits',$('#rulesIn').value);$('#rulesSaved').textContent='Сохранено'};
  $('#exM').onclick=exportModels;$('#imM').onclick=importModels;$('#exH').onclick=exportHistory;
  $('#clrH').onclick=async()=>{if(!confirm('Удалить всю историю сессий?'))return;try{await Sessions.clear();LIVE.clear();S.session=null;toast('История очищена')}catch(e){toast(e.message,true)}};
  bindWsSettings();refreshAccess();
  if(S.setTab&&S.setTab!=='conn')setTimeout(()=>$('#st-'+S.setTab)?.scrollIntoView({block:'start'}),30);
}

/* экран «нет доступа» */
function gate(a){
  const sub=a&&a.reason==='subscription';
  $('#root').innerHTML=`<div class="onb gate"><div class="l"><div class="brand"><div class="logo">MM</div><span class="tag">ModelMate · новый кабинет</span></div>
    <div class="mid"><span class="chip lime" style="align-self:flex-start">Демо</span><h1>Новый <span class="serif">кабинет</span></h1>
      <p class="muted" style="font-size:17px;margin:0">Референс → готовый промпт → генерация в один клик. Модели с набором ракурсов, проверка результата Grok и второй проход.</p></div>
    <div class="tag">Старый кабинет продолжает работать как раньше</div></div>
    <div class="r"><div class="card panel">
      <div class="tag">${sub?'Нужна подписка':'Демо выключено'}</div>
      <h2 style="margin:6px 0 10px;font:600 22px var(--sans)">${sub?'Демо доступно на активной подписке':'Новый кабинет сейчас недоступен'}</h2>
      <p class="muted" style="font-size:14px;margin:0">${sub?'Оформи или продли тариф в разделе «Тариф и баланс» — новый кабинет откроется сразу.':'Загляни позже — мы включим демо снова.'}</p>
      <div style="display:flex;gap:10px;margin-top:22px;border-top:1px solid var(--border-1);padding-top:18px;flex-wrap:wrap">${sub?'<a class="btn btn-pri" style="flex:1" href="/workspace/billing">Тариф и баланс</a>':''}<a class="btn" href="/workspace/">← Старый кабинет</a></div>
    </div></div></div>`;
}

/* ===================================================================== */
/* аварийный экран вместо чёрного */
function crash(msg){const r=$('#root');r.innerHTML=`<div style="max-width:640px;margin:15vh auto;padding:24px" class="card"><div class="tag" style="color:var(--danger)">Ошибка запуска</div><h2 style="margin:8px 0;font:600 22px var(--sans)">Приложение не смогло открыться</h2><p class="muted" style="font-size:14px">Сделай скриншот этого окна и пришли — по тексту ниже сразу будет понятно, что чинить.</p><pre class="code" style="font-size:12px">${esc(msg)}</pre><button class="btn" onclick="location.reload()">Обновить страницу</button></div>`}
window.addEventListener('error',e=>{if(!$('#root').children.length||$('#root .boot'))crash((e.message||'')+' @'+(e.lineno||''))});
window.addEventListener('unhandledrejection',e=>{if(!$('#root').children.length)crash(String(e.reason?.stack||e.reason))});
(async()=>{
  $('#root').innerHTML='<div class="boot"><span class="spin"></span></div>';
  try{ACCESS=await api('/access')}catch(e){if(e.status===401)return;crash('Не удалось открыть кабинет: '+e.message);return}
  if(!ACCESS.allowed){gate(ACCESS);return}
  try{await reloadModels()}catch(e){console.error(e);toast('Модели не загрузились: '+e.message,true)}
  try{render()}catch(e){crash(e.stack||e.message);return}
  resumeRuns();
  if(!S.models.length)setTimeout(()=>{if(S.view==='ref'&&!S.models.length)toast('Начни с модели: вкладка «Модели» → «Новая модель»')},600);
})();
</script>
