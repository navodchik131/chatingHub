map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/conf.d/chat-subdomain.conf;

server {
    listen 80 default_server;
    server_name localhost _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    location /api/ws {
        proxy_pass http://api:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public-model-image/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Host nginx: location /workspace/ { proxy_pass http://frontend/; } — префикс /workspace/ срезается.
    # Браузер: /workspace/workflow/ → сюда приходит /workflow/

    location = /workflow {
        return 301 /workflow/;
    }

    location ^~ /workflow/ {
        root /usr/share/nginx/html/workspace;
        try_files $uri $uri/ /workflow/index.html;
    }

    # Unibox: статика /chat/assets/* — без fallback на index.html (иначе браузер кэширует битый JS)
    location ^~ /chat/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /chat/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /chat/sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Service-Worker-Allowed "/chat/" always;
    }

    location = /chat/manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, max-age=0" always;
        default_type application/manifest+json;
    }

    # Unibox chat SPA: /chat/ → dist-chat
    location ^~ /chat/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /chat/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Кабинет SPA: /workspace/ → /, /workspace/images → /images, …
    location / {
        try_files $uri $uri/ /index.html;
    }
}
